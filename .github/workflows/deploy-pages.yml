# 前端自动部署 GitHub Pages（推 main / dev/frontend 即发布）
# 首次使用需两步（一次性）：
#   1. 仓库 Settings → Secrets and variables → Actions → New repository secret，添加：
#      VITE_AHOLO_API_KEY / VITE_AHOLO_LOD_META_URL / VITE_AHOLO_VOXEL_META_URL / VITE_WORLD_ID
#      （值同 frontend/.env.example 说明，找前端 A 要）
#   2. 仓库 Settings → Pages → Source 选「GitHub Actions」
name: Deploy frontend to Pages

on:
  push:
    branches: [main, dev/frontend]
    paths: ['frontend/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_AHOLO_API_KEY: ${{ secrets.VITE_AHOLO_API_KEY }}
          VITE_AHOLO_LOD_META_URL: ${{ secrets.VITE_AHOLO_LOD_META_URL }}
          VITE_AHOLO_VOXEL_META_URL: ${{ secrets.VITE_AHOLO_VOXEL_META_URL }}
          VITE_WORLD_ID: ${{ secrets.VITE_WORLD_ID }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
